<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms - Lets Learn it</title>
  </head>
  <body>
    <h1>Form to apply my Personal Business</h1>
    <form action="post">
      <div>
        <label for="username">Enter your Username</label>
        <input
          type="text"
          id="username"
          name="username"
          placeholder="Enter your username"
        />
      </div>
      <label for="male">Male</label>
      <input type="radio" id="male" name="gender" value="male">
      <label for="female">Female</label>
      <input type="radio" id="female" name="gender" value="female">
      
      </div>
      <div>
        <input type="checkbox" name="agree" value="yes"> I agree
      </div>
      <div>
        <label for="comment"></label>
        <textarea id="comment" name="comments" rows="4" cols="50">Enter comments here....</textarea>
      </div>
      <div>
        <select name="country"><option value="usa">United States</option><option value="canada">Canada</option><option value="India">India</option></select>
      </div>
    </form>
  </body>
</html>
